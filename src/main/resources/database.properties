# ============================================================
# Vinheria Agnello — Configuração do banco de dados
# ------------------------------------------------------------
# Preencha as credenciais do seu banco e reinicie o Tomcat.
# Esquemas suportados: ORACLE (padrão FIAP) ou MYSQL.
# ============================================================

db.dialect=mysql
db.url=jdbc:mysql://localhost:3306/vinheria?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
db.user=vinheria
db.password=1234

# --- Pool de conexões (HikariCP) ---
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=10000

db.autoBootstrap=true
